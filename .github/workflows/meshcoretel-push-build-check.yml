name: Heltec V4 Main Build Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "examples/**"
      - "variants/**"
      - "platformio.ini"
      - ".github/workflows/meshcoretel-push-build-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_MESHCORE_VERSION: ${{ vars.OFFICIAL_MESHCORE_VERSION }}
      PLATFORMIO_BUILD_FLAGS: -UMQTT_DEBUG
    strategy:
      fail-fast: false
      matrix:
        environment:
          # Release target and one shared-web compatibility target.
          - heltec_v4_repeater_mqtt
          - T_Beam_S3_Supreme_SX1262_repeater_mqtt

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
